version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    container_name: ddsi_db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: DDSI_076
      MARIADB_USER: DDSI_076
      MARIADB_PASSWORD: DDSI_076
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
